<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vinicius Macedo | Desenvolvedor Full Stack</title>
  <meta name="description" content="Introdução interativa ao portfólio de Vinicius Macedo.">

  <link rel="stylesheet" href="assets/intro.css">
</head>

<body>

  <main class="intro-shell" id="introShell" aria-label="Introdução do portfólio">

    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <canvas id="particleField" class="particle-field" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="atom-wrap" id="atomWrap" aria-hidden="true">
      <svg class="atom-symbol" viewBox="0 0 400 400">
        <defs>
          <filter id="atomGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <radialGradient id="nucleusGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#8bdcff" />
            <stop offset="100%" stop-color="#1d6fa6" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- órbita 1 -->
        <g transform="rotate(0 200 200)">
          <path d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            class="orbit-ring" />
          <path id="orbitPath1" d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            pathLength="100" class="orbit-trail orbit-trail-1" />
          <circle r="5.5" class="electron" filter="url(#atomGlow)">
            <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto">
              <mpath href="#orbitPath1" />
            </animateMotion>
          </circle>
        </g>

        <!-- órbita 2 -->
        <g transform="rotate(60 200 200)">
          <path d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            class="orbit-ring" />
          <path id="orbitPath2" d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            pathLength="100" class="orbit-trail orbit-trail-2" />
          <circle r="5.5" class="electron" filter="url(#atomGlow)">
            <animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto">
              <mpath href="#orbitPath2" />
            </animateMotion>
          </circle>
        </g>

        <!-- órbita 3 -->
        <g transform="rotate(120 200 200)">
          <path d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            class="orbit-ring" />
          <path id="orbitPath3" d="M 50,200 A150,58 0 1,1 350,200 A150,58 0 1,1 50,200"
            pathLength="100" class="orbit-trail orbit-trail-3" />
          <circle r="5.5" class="electron" filter="url(#atomGlow)">
            <animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto">
              <mpath href="#orbitPath3" />
            </animateMotion>
          </circle>
        </g>

        <circle cx="200" cy="200" r="16" fill="url(#nucleusGradient)" class="nucleus" filter="url(#atomGlow)" />
      </svg>
    </div>

    <section class="intro-content">

      <p class="eyebrow">DESENVOLVEDOR FULL STACK / AUTOMAÇÕES &amp; SISTEMAS</p>

      <div class="logo-stage" id="logoStage" aria-label="Vinicius Macedo">
        <!-- letras inseridas via JS -->
        <span class="logo-shine" aria-hidden="true"></span>
      </div>

      <p class="intro-caption">TRANSFORMANDO PROCESSOS EM SISTEMAS<span>_</span></p>

      <a class="portfolio-button" id="enterPortfolio" href="portfolio.html" aria-label="Entrar no portfólio">
        <span>ENTRAR NO PORTFÓLIO</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>

    </section>

    <button class="skip-button" id="skipButton" type="button">Pular intro <span aria-hidden="true">↗</span></button>

    <div class="intro-status"><span></span> SISTEMA ONLINE</div>

  </main>

  <script src="assets/intro.js"></script>

</body>

</html>
