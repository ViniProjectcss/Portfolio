<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vinicius Macedo | Desenvolvedor Full Stack</title>
  <meta name="description" content="Introdução interativa ao portfólio de Vinicius Macedo.">

  <link rel="stylesheet" href="assets/intro.css">
</head>

<body>

  <main class="intro-shell" id="introShell" aria-label="Introdução do portfólio">

    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <canvas id="particleField" class="particle-field" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <!--
      Átomo 3D (CSS 3D real: perspective + translateZ + rotateX/Y/Z).
      Hierarquia (cada nível tem UMA responsabilidade de movimento):
        atom-stage  -> câmera (perspective) + fade/blur de entrada
        atom-dolly  -> translateZ: o átomo vem "de longe" até a tela
        atom-drift  -> translateX/Y: o caminho até o centro
        atom-tumble -> rotateX/Y/Z: o giro rápido que vai desacelerando
        atom-idle   -> giro lento contínuo depois que chegou
        ring        -> cada órbita é um plano 3D com sua própria inclinação
    -->
    <div class="atom-veil" id="atomWrap" aria-hidden="true">
    <div class="atom-stage">
      <div class="atom-dolly">
        <div class="atom-drift">

          <div class="atom-tumble">
            <div class="atom-idle">

              <!-- órbita 1 -->
              <div class="ring ring-1">
                <i class="ring-layer is-edge" style="--k:-2"></i>
                <i class="ring-layer" style="--k:-1"></i>
                <i class="ring-layer" style="--k:0"></i>
                <i class="ring-layer" style="--k:1"></i>
                <i class="ring-layer is-edge" style="--k:2"></i>
                <i class="ring-trail"></i>
                <div class="electron-arm">
                  <i class="electron"></i>
                  <i class="electron electron-cross"></i>
                </div>
              </div>
              <!-- órbita 2 -->
              <div class="ring ring-2">
                <i class="ring-layer is-edge" style="--k:-2"></i>
                <i class="ring-layer" style="--k:-1"></i>
                <i class="ring-layer" style="--k:0"></i>
                <i class="ring-layer" style="--k:1"></i>
                <i class="ring-layer is-edge" style="--k:2"></i>
                <i class="ring-trail"></i>
                <div class="electron-arm">
                  <i class="electron"></i>
                  <i class="electron electron-cross"></i>
                </div>
              </div>
              <!-- órbita 3 -->
              <div class="ring ring-3">
                <i class="ring-layer is-edge" style="--k:-2"></i>
                <i class="ring-layer" style="--k:-1"></i>
                <i class="ring-layer" style="--k:0"></i>
                <i class="ring-layer" style="--k:1"></i>
                <i class="ring-layer is-edge" style="--k:2"></i>
                <i class="ring-trail"></i>
                <div class="electron-arm">
                  <i class="electron"></i>
                  <i class="electron electron-cross"></i>
                </div>
              </div>

            </div>
          </div>

          <!-- núcleo: fica fora do tumble pra sempre "olhar" pra câmera (brilho esférico) -->
          <div class="nucleus"></div>

        </div>
      </div>
    </div>
    </div>

    <section class="intro-content">

      <p class="eyebrow">DESENVOLVEDOR FULL STACK / AUTOMAÇÕES &amp; SISTEMAS</p>

      <div class="logo-stage" id="logoStage" aria-label="Vinicius Macedo">
        <!-- letras inseridas via JS -->
        <span class="logo-shine" aria-hidden="true"></span>
      </div>

      <p class="intro-caption">TRANSFORMANDO PROCESSOS EM SISTEMAS<span>_</span></p>

      <a class="portfolio-button" id="enterPortfolio" href="portfolio.html" aria-label="Entrar no portfólio">
        <span>ENTRAR NO PORTFÓLIO</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>

    </section>

    <button class="skip-button" id="skipButton" type="button">Pular intro <span aria-hidden="true">↗</span></button>

    <div class="intro-status"><span></span> SISTEMA ONLINE</div>

  </main>

  <script src="assets/intro.js"></script>

</body>

</html>
